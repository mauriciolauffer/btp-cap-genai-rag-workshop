  - name: service-instance
    alias: xsuaa
    version: ">0.0.0"
  - name: service-instance
    alias: destination
    version: ">0.0.0"
  - name: service-instance
    alias: repo-host
    version: ">0.0.0"
  - name: service-instance
    alias: repo-runtime
    version: ">0.0.0"
  - name: service-instance
    alias: hana
    version: ">0.0.0"
  - name: service-instance
    alias: aicore
    version: ">0.0.0"
