version: 0.0.1
appVersion: 0.0.1
annotations:
  app.kubernetes.io/managed-by: cds-dk/helm
dependencies:

# Modules
  - name: web-application
    alias: srv
    version: ">0.0.0"
  - name: web-application
    alias: router
    version: ">0.0.0"
  - name: content-deployment
    alias: hana-deployer
    version: ">0.0.0"
